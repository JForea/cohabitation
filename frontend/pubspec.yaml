name: frontend
description: 'A new Flutter project.'

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  go_router: ^17.2.1
  dio: ^5.9.2
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  riverpod_devtools: ^0.4.4
  intl: ^0.20.2
  dotted_border: ^3.1.0
  image_picker: ^1.2.2
  table_calendar: ^3.2.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  uuid: ^4.5.1
  fl_chart: ^1.2.0

dev_dependencies:
  mocktail: ^1.0.5
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/icons/buying_categories/
    - assets/icons/top/
    - assets/icons/expense_categories/
    - assets/icons/notification_types/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/manrope/Manrope-Light.ttf
          weight: 300
